name: Build (reusable)

on:
  push:
  workflow_call:
  workflow_dispatch:
  pull_request: 

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        run: |
          pipx install clang-format==21.1.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: ./xenia-build.py lint --all

  build-android:
    name: Build Android
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Install CMake via sdkmanager
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1"

      - name: Cache Slang
        id: cache-slang
        uses: actions/cache@v5
        with:
          path: .slang
          key: ${{ runner.os }}-${{ runner.arch }}-slang-2026.8

      - name: Download Slang
        if: steps.cache-slang.outputs.cache-hit != 'true'
        run: ./xenia-build.py slang

      - name: Setup
        run: |
         sudo apt-get update
         sudo apt-get install -y \
           libgtk-3-dev \
           libxss-dev \
           libx11-xcb-dev \
           libxcb1-dev \
           libxcb-util-dev
         git submodule update --init --depth=1 -j$(getconf _NPROCESSORS_ONLN) $(grep -oP '(?<=path = )(?!third_party\/DirectXShaderCompiler).+' .gitmodules)
         ./xenia-build.py fetchdata

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Build Host Tools
        env:
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          CC: /usr/bin/gcc
          CXX: /usr/bin/g++
        run: |
         cmake -S . -B build-host \
           -G "Ninja" \
           -DCMAKE_BUILD_TYPE=Release \
           -DXENIA_ENABLE_LTO=OFF \
           -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
      
         cmake --build build-host \
           --target xenia-shader-cc \
           -j$(getconf _NPROCESSORS_ONLN)
      
      - name: Build Android NDK libraries
        env:
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          mkdir -p build-android/host_tools
          mkdir -p build

          python3 xenia-build.py generate-version --build-dir build-android

          python3 << 'EOF'
          import os
          import subprocess

          def git_get_head_info():
              p = subprocess.Popen(["git", "symbolic-ref", "--short", "-q", "HEAD"], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              branch_name = p.communicate()[0].decode("ascii").strip() or "detached"
              
              p = subprocess.Popen(["git", "rev-parse", "HEAD"], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              commit = p.communicate()[0].decode("ascii").strip() or "unknown"
              
              p = subprocess.Popen(["git", "rev-parse", "--short", "HEAD"], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              commit_short = p.communicate()[0].decode("ascii").strip() or "unknown"
              
              return branch_name, commit, commit_short

          def is_pull_request():
              return os.getenv('GITHUB_EVENT_NAME') == 'pull_request'

          def get_pr_number():
              github_ref = os.getenv('GITHUB_REF')
              if github_ref and github_ref.startswith('refs/pull/'):
                  return github_ref.split('/')[2]
              return None

          branch_name, commit, commit_short = git_get_head_info()
          pr_number = get_pr_number() if is_pull_request() else None

          contents = f"""// Autogenerated by xenia-build.py.
          #ifndef GENERATED_VERSION_H_
          #define GENERATED_VERSION_H_
          #define XE_BUILD_BRANCH "{branch_name}"
          #define XE_BUILD_COMMIT "{commit}"
          #define XE_BUILD_COMMIT_SHORT "{commit_short}"
          #define XE_BUILD_DATE __DATE__
          """

          if pr_number:
              contents += f"""#define XE_BUILD_IS_PR
          #define XE_BUILD_PR_NUMBER "{pr_number}"
          """

          contents += """#endif  // GENERATED_VERSION_H_
          """

          os.makedirs("build", exist_ok=True)
          with open("build/version.h", "w") as f:
              f.write(contents)
          EOF

          find build-host -name xenia-shader-cc -type f -executable -exec cp {} build-android/host_tools/ \;
          chmod +x build-android/host_tools/xenia-shader-cc

          cp build/version.h build-android/version.h
          
          file build-android/host_tools/xenia-shader-cc

          export ANDROID_NDK_ROOT=${{ steps.setup_ndk.outputs.ndk-path }}
          export NDK_CLANG=${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang

          cmake -S . -B build-android \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=24 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK=${ANDROID_NDK_ROOT} \
            -DCMAKE_ANDROID_PLATFORM=android-24 \
            -DXENIA_HOST_TOOLS_DIR=$(cd build-android/host_tools && pwd) \
            -G "Ninja" \
            -DXENIA_ENABLE_LTO=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS="-fPIC -march=armv8-a" \
            -DCMAKE_CXX_FLAGS="-fPIC -march=armv8-a" \
            -DCMAKE_ASM_FLAGS="-fPIC -march=armv8-a" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-Bsymbolic" \
            -DCMAKE_ASM_COMPILER="${NDK_CLANG}" \
            -DXENIA_BUILD_TESTS=OFF \
            -DXENIA_UI=OFF \
            -DFFMPEG_ENABLE_ASM=ON \
            -DFFMPEG_ENABLE_NEON=ON \
            -DFFMPEG_EXTRA_CONFIGURE_FLAGS="--enable-pic" \
            -DFFMPEG_EXTRA_CFLAGS="-fPIC"
            
          cmake --build build-android --config Release -j$(getconf _NPROCESSORS_ONLN)

      - name: Copy native libraries
        run: |
          mkdir -p android/android_studio_project/app/src/main/jniLibs/arm64-v8a
          find build-android -name "libxenia*.so" -type f -exec cp {} android/android_studio_project/app/src/main/jniLibs/arm64-v8a/ \;
          ls -la android/android_studio_project/app/src/main/jniLibs/arm64-v8a/

      - name: Build Android APK
        working-directory: android/android_studio_project
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          ./gradlew assembleGithubDebug

      - name: Find Android libraries
        run: |
         find build-android -name "*.so" -type f

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: inspect shader compiler
        if: always()
        run: |
         file build-android/host_tools/xenia-shader-cc

      - name: Prepare artifacts
        id: prepare_artifacts
        run: |
          mkdir -p artifacts/android
          find . -name "*.apk" -exec cp {} artifacts/android/ \;
          cp LICENSE artifacts/android/

      - name: Upload xenia edge Android artifacts
        if: steps.prepare_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: xenia_edge_android
          path: artifacts/android
          if-no-files-found: error

      - name: Upload FFmpeg files
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-tx-float-debug
          path: |
           third_party/FFmpeg/libavutil/tx_float.c
           third_party/FFmpeg/libavutil/aarch64/tx_float_neon.S
           **/obj/Linux/liblibavutil.a
          if-no-files-found: error
