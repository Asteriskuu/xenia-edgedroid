name: Squash And Merge

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: edge
          fetch-depth: 0

        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          UPSTREAM_URL=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}" \
            | jq -r '.parent.clone_url')

          if [ "$UPSTREAM_URL" = "null" ] || [ -z "$UPSTREAM_URL" ]; then
            echo "Error: This repository is not a fork or cannot access upstream metadata."
            exit 1
          fi

          echo "Upstream repository: $UPSTREAM_URL"

          git remote add upstream "$UPSTREAM_URL"

          git fetch upstream edge

          git checkout edge

          git merge --squash -X ours upstream/edge

          git commit -m "Squash and merge upstream changes"

          git push origin edge
